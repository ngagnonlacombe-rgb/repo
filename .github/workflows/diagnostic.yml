# Temporaire : agrandit le disque de l'app à 10 Go (accord de Nicolas le 2026-11-17), puis vérifie l'espace libre.
name: Diagnostic Fly (disque)

on:
  push:
    branches: [diagnostic-fly]

jobs:
  disque:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Agrandir le disque à 10 Go
        run: flyctl volumes extend vol_491m5megdwjmz0zr --size 10 --app app-employes-ngl --yes
      - name: Vérifier
        run: |
          sleep 20
          flyctl volumes list --app app-employes-ngl
          flyctl ssh console --app app-employes-ngl -C "df -h /donnees" || true
          flyctl logs --app app-employes-ngl --no-tail | tail -n 25 || true
