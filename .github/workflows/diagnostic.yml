# Temporaire : lecture seule de l'état de l'app sur Fly.io (disque, machines, erreurs récentes). Rien n'est modifié.
name: Diagnostic Fly (lecture seule)

on:
  push:
    branches: [diagnostic-fly]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Machines et disque
        run: |
          flyctl status --app app-employes-ngl || true
          flyctl volumes list --app app-employes-ngl || true
          flyctl machine list --app app-employes-ngl || true
      - name: Espace disque dans la machine
        run: flyctl ssh console --app app-employes-ngl -C "df -h /donnees /" || true
      - name: Taille des dossiers
        run: flyctl ssh console --app app-employes-ngl -C "sh -c 'du -sh /donnees/* /donnees/factures/* 2>/dev/null'" || true
      - name: Dernières lignes du journal
        run: flyctl logs --app app-employes-ngl --no-tail | tail -n 150 || true
