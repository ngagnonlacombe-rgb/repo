# Configuration Fly.io : un seul petit serveur à Toronto, avec un disque pour la base et les photos.
app = 'app-employes-ngl'
primary_region = 'yyz'

[env]
  NODE_ENV = 'production'
  DOSSIER_DONNEES = '/donnees'
  PORT = '3000'
  QBO_URL_RETOUR = 'https://app-employes-ngl.fly.dev/api/qbo/retour'
  QBO_ENVIRONNEMENT = 'sandbox'

[http_service]
  internal_port = 3000
  force_https = true
  # La machine s'endort quand personne n'utilise l'app et se réveille à la première visite.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/api/etat'
    timeout = '5s'

[[mounts]]
  source = 'donnees'
  destination = '/donnees'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
